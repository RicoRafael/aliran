# Hand-reviewed entity mappings.
#
# Committed on purpose. Where the API cannot connect a licence-holding company
# to a listed issuer, a human decision goes here — visible and checkable, not
# hidden inside the pipeline. Resolutions from this file are tagged
# method: manual, confidence: 1.00 and are labelled as manual in the UI.
#
# RULE: only add an entry you can source. Put the source in `evidence`.
# A wrong mapping here is worse than a visible gap, because it silently
# attributes physical assets to the wrong company's valuation.

mappings: []

# Format:
#
# mappings:
#   - company_slug: pt-example-coal
#     symbol: XXXX.JK
#     attributable_share: 0.90
#     evidence: "2024 annual report p.42 — 90% held via PT Example Holdings"
#     reviewed_by: rico
#     reviewed_on: 2026-08-27


